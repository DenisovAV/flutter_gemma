name: Codelabs

on:
  push:
    branches: [main]
    paths: ['codelabs/**', 'tool/check_codelabs.sh', '.github/workflows/codelabs.yml']
  pull_request:
    paths: ['codelabs/**', 'tool/check_codelabs.sh', '.github/workflows/codelabs.yml']
  # The step apps pin published packages, so they can break without anyone
  # touching this repo. A nightly run is what catches that.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Checkout is the only thing that touches the repo.
permissions:
  contents: read

# A push, a PR sync and the nightly can otherwise run three copies of an
# 18-resolution job at once.
concurrency:
  group: codelabs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flutter ${{ matrix.channel }}
    runs-on: ubuntu-latest
    # beta is an early warning, not a gate: a lint that only exists on beta
    # must not turn every PR in the repo red for something no author did.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      # No setup-java: this job runs pub get / analyze / format / test, none of
      # which invoke Gradle. Add it back if an Android *build* leg is added.
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter --version
      - run: tool/check_codelabs.sh
