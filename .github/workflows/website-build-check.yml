# Build the fluttergemma.dev website on every PR that touches it — no deploy.
# Catches SSG / web-build breakage (e.g. a non-Dart code fence that crashes the
# Jaspr highlighter, or a dart2js API drift in the /try example) BEFORE merge,
# instead of only discovering it when the merge deploy fails and the live site
# is left on the previous build.
name: Website build check (PR)
on:
  pull_request:
    paths:
      - 'website/**'
      - 'packages/flutter_gemma/example/**'
      - '.github/workflows/website-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (bundles Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        # Pin to 0.23.1 — jaspr_cli 0.23.2 fails with "Failed to start build
        # daemon, port file is missing" (build-daemon regression). Matches the
        # `jaspr: ^0.23.1` pin in website/pubspec.yaml. Bump deliberately.
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Build Jaspr site (SSG)
        working-directory: website
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          dart pub get
          jaspr build --sitemap-domain "https://fluttergemma.dev"

      - name: Export codelabs (claat static export → /codelabs)
        # Same claat export the merge workflow runs, so a broken codelab source
        # is caught on the PR instead of on the live deploy. Binary pinned by
        # SHA-256 (mutable tag) to match the deploy workflow.
        working-directory: website
        env:
          CLAAT_URL: https://github.com/googlecodelabs/tools/releases/download/v2.2.6/claat-linux-amd64
          CLAAT_SHA256: b7415471bd823562ebd9e6015e267a12fbf9340dfe839f8e2a175b6c7c0f397a
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/claat" "$CLAAT_URL"
          echo "$CLAAT_SHA256  $RUNNER_TEMP/claat" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/claat"
          mkdir -p build/jaspr/codelabs
          for src in codelabs/*/index.md; do
            [ -e "$src" ] || continue
            "$RUNNER_TEMP/claat" export -o build/jaspr/codelabs "$src"
          done
          # Guard against an empty glob / wrong cwd / claat emitting nothing, so
          # the PR gate fails loudly instead of passing green on zero codelabs.
          # `-mindepth 2` is load-bearing: the catalogue route writes
          # build/jaspr/codelabs/index.html itself, which would match at depth 1
          # and pass this guard on zero codelabs. Only claat writes <id>/.
          if [ -z "$(find build/jaspr/codelabs -mindepth 2 -name index.html -print -quit)" ]; then
            echo "ERROR: no codelab HTML produced under build/jaspr/codelabs" >&2
            exit 1
          fi

      - name: Build Flutter web example (live demo at /try)
        working-directory: packages/flutter_gemma/example
        run: |
          flutter pub get
          flutter build web --release --base-href /try/
