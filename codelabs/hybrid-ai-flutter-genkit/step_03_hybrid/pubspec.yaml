name: workshop_genkit_flutter_hybrid_ai
description: "Workshop: Hybrid AI in Flutter — From Cloud to On-Device with Genkit Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cloud AI via Gemini API (Genkit)
  genkit: ^0.16.0
  genkit_google_genai: ^0.3.1

  # On-device AI via genkit_flutter_gemma
  genkit_flutter_gemma: ^0.6.0
  flutter_gemma: ^1.7.0
  # LiteRT-LM engine (.litertlm inference) + LiteRT embedding backend —
  # flutter_gemma 1.x registers no engines by default; opt in here.
  flutter_gemma_litertlm: ^1.6.1

  # Hybrid on-device ↔ cloud routing
  genkit_hybrid: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tourist_data/
