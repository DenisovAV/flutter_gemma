name: flutter_gemma_rag_qdrant
description: "qdrant-edge on-device RAG vector store for flutter_gemma (official UniFFI SDK). Opt-in VectorStoreRepository with payload filtering. Native platforms only (no web)."
version: 1.1.0
# This validation fork wires the SDK via a local path dependency; not for
# publishing in this state. A release would pin a pub.dev version of qdrant_edge.
publish_to: none
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_gemma/tree/main/packages/flutter_gemma_rag_qdrant
topics: [rag, qdrant, vector-search, embeddings, on-device]

# Native-only (qdrant-edge Rust FFI). Declared explicitly so the supported
# platform set is the package's own contract, not inferred from the transitive
# import graph. No web — use flutter_gemma_rag_sqlite (WebSqliteVectorStore).
platforms:
  android:
  ios:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.1.0
  uuid: ^4.0.0
  # Official Qdrant Edge Dart SDK (UniFFI binding of the shared qdrant-edge-ffi
  # crate). Local path dep for this validation fork — the native engine + its
  # Native Assets build hook come from here, so this package no longer carries
  # its own hook/ffigen bindings. A published release would pin a version.
  qdrant_edge:
    path: /Users/sashadenisov/Work/qdrant-dart/lib/edge/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block — the native lib is delivered as a CodeAsset by
# the qdrant_edge SDK's Native Assets build hook, not a platform-channel plugin.
