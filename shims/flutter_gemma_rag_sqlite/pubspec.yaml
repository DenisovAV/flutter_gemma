name: flutter_gemma_rag_sqlite
description: "Renamed to flutter_edge_ai_sqlite. This final release re-exports flutter_edge_ai_sqlite, so existing imports keep compiling with a deprecation warning."
version: 2.0.0
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_gemma/tree/main/shims/flutter_gemma_rag_sqlite
issue_tracker: https://github.com/DenisovAV/flutter_gemma/issues

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  # 3.47.0, higher than the rest of this repo, and deliberately so. sqlite3
  # 3.6.0 is the first release whose `IndexedDbFileSystem.flush()` awaits an
  # in-flight write batch, and it needs hooks ^2.2.0 -> record_use -> meta
  # ^1.19.0, which Flutter 3.44.x pins to 1.18.0 exactly. Rather than ship a
  # version of this package whose `flush()` can return over unwritten pages,
  # the floor lets pub keep 3.44 consumers on 1.3.2, where that limitation is
  # what the README and CHANGELOG already describe.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai_sqlite: ^1.4.0
