org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Stays false, and not because a plugin still applies KGP — as of the versions
# in pubspec.lock none do. Built-in Kotlin is blocked upstream: AGP 9.4 bundles
# Kotlin 2.2.10 while the Flutter Gradle plugin demands >= 2.2.20, so it
# refuses to apply (flutter/flutter#192167). Flip this to true, and drop the
# KGP declarations, once that lands.
android.builtInKotlin=false
# AGP 9 defaults android.newDsl=true, which the Flutter Gradle plugin cannot
# be applied under yet.
android.newDsl=false
