# Declares the tags used by test/qwen3/*.
#
# Nine suites there load the real Qwen3-TTS graphs from a HuggingFace snapshot
# on disk (~GBs) and compare their numeric output against PyTorch goldens.
# They already carried `@Tags(['qwen3-artifacts'])`, but no dart_test.yaml
# existed anywhere in the repo — so the tag was a label nothing acted on, and
# the suites ran regardless, failing on any machine without the snapshot.
#
# Declaring it here makes `--exclude-tags qwen3-artifacts` a supported,
# warning-free operation. tool/test_all.sh passes that flag only when the
# snapshot is genuinely absent, and prints that it did.
tags:
  qwen3-artifacts:
    # Not skipped by default: on a machine that has the snapshot these are the
    # only tests that verify the TTS pipeline end to end against real weights.
    # The runner decides, based on whether the files are actually there.
