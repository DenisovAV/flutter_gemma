name: flutter_gemma_embeddings
description: "Runtime-agnostic on-device text embedding pipeline (tokenization, isolate worker, pooling/normalization) for flutter_gemma. Pair with an engine package (e.g. flutter_gemma_litertlm) for a concrete EmbeddingBackendProvider."
version: 2.1.0
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_gemma/tree/main/packages/flutter_gemma_embeddings
topics: [embeddings, gemma, litert, rag, on-device]

# All six platforms: 5 native via dart:ffi (LiteRT C API) + web via LiteRT.js.
# Declared explicitly so the supported set is the package's own contract, not
# inferred from the transitive import graph.
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.5.9
  # Upper bound is deliberate, not laziness. 1.3.3 carries the list-form
  # `merges` parser SigLIP2's tokenizer.json needs (upstream #26). 1.4.0 then
  # ADDED `pre_tokenizer` validation without a `Split` case and now rejects that
  # same file — a compatibility regression, reported upstream. `^1.3.3` would
  # resolve to it and break the SigLIP2 profile on any fresh `pub get`. Relax to
  # `^1.3.3` once a release accepts `Split` again.
  dart_sentencepiece_tokenizer: ">=1.3.3 <1.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block, no hook/build.dart of its own, and — since
# the embedder decoupling refactor (2.0.0) — NO dependency on
# flutter_gemma_litertlm: this package no longer touches dart:ffi or any
# native handle at all. It owns tokenization, the background-isolate worker,
# and pooling/normalization over the `EmbeddingForwardPass` seam; the
# concrete native forward pass (and the native bundle it needs) now lives in
# whichever engine package supplies it (e.g. flutter_gemma_litertlm's
# LiteRtEmbeddingBackend).
