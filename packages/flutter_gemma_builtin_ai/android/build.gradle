group 'dev.flutterberlin.flutter_gemma_builtin_ai'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.flutterberlin.flutter_gemma_builtin_ai'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 26
        targetSdk = 36
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

// Built-in Kotlin migration (#440). This package no longer applies KGP itself,
// so it stops appearing in Flutter's "plugins that apply KGP" warning.
//
// What compiles the .kt now: Flutter's own Gradle plugin does it for us.
// `FlutterPluginUtils.detectApplyingKotlinGradlePlugin` scans every subproject's
// build file and, for one that applies AGP but not KGP, calls
// `pluginManager.apply("kotlin-android")` — with the KGP version the CONSUMING
// APP declares, not one pinned here (measured: 2.3.20 from the app's
// settings.gradle.kts). Its regex matches the `apply plugin:` form we use, not
// only a `plugins {}` block; if that ever stops matching, our Kotlin silently
// stops compiling and the plugin class vanishes — the #360 failure shape.
// This is why `flutter: '>=3.44.0'` in pubspec.yaml is load-bearing.
//
// It is also why the bare `kotlin {}` below resolves. Pre-#440 this was deferred
// through `pluginManager.withPlugin('kotlin-android')`, because back then the
// plugin decided for itself whether to apply KGP and a bare block failed with
// "Could not find method kotlin()" when it had not. KGP is now always applied,
// so the extension always exists — verified on AGP 8.11.1 and AGP 9.0.1, where
// the applied plugin is KotlinAndroidPluginWrapper and jvmTarget reads back as
// JVM_11. `kotlinOptions` inside `android {}` is not an alternative: AGP 9
// removes it.
//
// Note `android.builtInKotlin=true` still fails on AGP 9, and not because of
// this package: Flutter applies KGP to EVERY plugin subproject and AGP 9
// rejects that when built-in Kotlin is on. A bare `flutter create` app plus
// only `shared_preferences` fails identically. `false` is what the Flutter
// template writes and the only configuration that works today.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // ML Kit GenAI Prompt API (Gemini Nano via AICore) — bundled by this opt-in package.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
