group 'dev.flutterberlin.flutter_gemma_builtin_ai'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.flutterberlin.flutter_gemma_builtin_ai'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 26
        targetSdk = 36
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

// Built-in Kotlin (#440). KGP is no longer applied here: this package requires
// Flutter >= 3.44, which guarantees KGP 2.0.0 and lets a consuming app build on
// AGP 9 even with `android.builtInKotlin=false` — the configuration that broke
// #360 back when the plugin decided for itself whether to apply KGP.
//
// jvmTarget is set through the top-level `kotlin {}` DSL rather than the
// `kotlinOptions` block inside `android {}`, which AGP 9 removes.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // ML Kit GenAI Prompt API (Gemini Nano via AICore) — bundled by this opt-in package.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
