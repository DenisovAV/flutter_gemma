group 'dev.flutterberlin.flutter_gemma_mediapipe'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Inside a Flutter build this is inert: Gradle loads parent-first, so the
        // consuming app's AGP resolves `com.android.library` whatever is named here.
        // Kept anyway because this directory is ALSO a standalone Gradle root project
        // (own settings.gradle + a tracked wrapper, legacy scaffolding — Flutter's
        // current plugin template ships neither), where there is no parent to inherit
        // from and removing this fails at once with "Plugin with id
        // 'com.android.library' not found". That path cannot fully build post-#440
        // either way — nothing applies KGP outside a Flutter build, so `./gradlew` here
        // stops at the `kotlin {}` block below — but dropping the pin only moves the
        // failure earlier and makes the message less useful.
        classpath 'com.android.tools.build:gradle:8.9.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.flutterberlin.flutter_gemma_mediapipe'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        targetSdk = 36
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

// Kotlin plugin ownership (#440): this package no longer applies KGP itself.
// Flutter's Gradle plugin applies `kotlin-android` to any subproject that applies
// AGP without it (`FlutterPluginUtils.detectApplyingKotlinGradlePlugin`), using
// whatever KGP the app's plugin classpath resolves to. That code landed in
// flutter/flutter#184745, first released in 3.44 — which is what makes
// `flutter: '>=3.44.0'` in pubspec.yaml load-bearing rather than cosmetic.
//
// That apply is also why the bare `kotlin {}` below resolves, and on the KGP path
// the block is a safety net rather than a liability: if KGP is not applied,
// configuration fails loudly with "Could not find method kotlin()" instead of
// quietly compiling no Kotlin. That is what makes this shape immune to #360.
//
// jvmTarget goes through the top-level `kotlin {}` DSL and not `kotlinOptions`
// inside `android {}`: that block is KGP's, is deprecated there, and does not
// exist at all under AGP's built-in Kotlin.
//
// `dev.flutter.flutter-gradle-plugin` carries KGP itself, so a normal Flutter app
// builds even when its own settings.gradle.kts declares none (measured: the plugin
// classes were still in the dex). An add-to-app host that supplies no KGP does
// fail here — but it already failed on `large_file_handler`, a hard dependency
// shipping this same shape; the fix is one KGP line in the host.
//
// Do NOT try to insure against that with a `kotlin-gradle-plugin` classpath in the
// buildscript above. It cannot work: `detectApplyingKotlinGradlePlugin` runs while
// `:app` is evaluated, BEFORE this subproject's `buildscript {}` exists. Such a pin
// was only ever load-bearing for a host supplying no KGP — and such a host already
// failed on our sibling dependencies.
//
// This block SURVIVES AGP's built-in Kotlin, so do not delete it when AGP 10 drops
// `android.builtInKotlin=false`: built-in Kotlin registers its own project
// extension also named `kotlin`, so `compilerOptions` keeps resolving. Measured on
// AGP 9.0.1 with `builtInKotlin=true` and no KGP anywhere — built via
// `built_in_kotlinc`, class file major version 55 (Java 11), i.e. jvmTarget honored.
//
// Keep this block byte-identical in flutter_gemma, flutter_gemma_mediapipe and
// flutter_gemma_builtin_ai. #360 is what a half-fix looks like: the .kt stops
// compiling, the plugin class is never emitted, the build stays GREEN, and the app
// fails at runtime in GeneratedPluginRegistrant.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // MediaPipe (.task) on-device LLM inference — bundled by this opt-in package.
    implementation 'com.google.mediapipe:tasks-genai:0.10.33'
    implementation 'com.google.mediapipe:tasks-vision-image-generator:0.10.26.1'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
}
