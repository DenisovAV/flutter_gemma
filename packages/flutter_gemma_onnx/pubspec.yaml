name: flutter_gemma_onnx
description: "ONNX Runtime GenAI on-device inference engine for flutter_gemma (5 native platforms, no web). Opt-in InferenceEngineProvider for ORT-GenAI model directories."
version: 0.1.0
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_gemma/tree/main/packages/flutter_gemma_onnx
topics: [gemma, llm, onnx, onnxruntime, on-device]

# 5 native platforms only, no web — ORT-GenAI has no WASM build (see the
# design doc §3 / hardened plan D1). Declared explicitly so the supported set
# is the package's own contract, not inferred from the transitive import graph.
platforms:
  android:
  ios:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.5.9
  flutter_gemma_embeddings: ^2.0.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block yet for the INFERENCE arm — the scaffold
# only (provider identity + canHandle); productionizing it is gated on the
# D2 throughput spike. The EMBEDDING arm (OnnxEmbeddingBackend) is
# productionized (Phase 2): plain-ORT forward pass over dart:ffi, no ORT
# GenAI. The native ORT-GenAI + libonnxruntime bundle (hook/build.dart, the
# sole owner per hardened-plan D1) is added in a later step — Task 2's
# `OrtFfiClient` resolves the dylib directly (platform default names, or
# `FLUTTER_GEMMA_ORT_LIBRARY` for host tests) until then.
