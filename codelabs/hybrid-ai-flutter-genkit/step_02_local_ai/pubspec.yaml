name: workshop_genkit_flutter_hybrid_ai
description: "Workshop: Hybrid AI in Flutter — From Cloud to On-Device with Genkit Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Step 2: Cloud AI via Gemini API
  genkit: ^0.16.0
  genkit_google_genai: ^0.3.1

  # Step 3: On-device AI via genkit_flutter_gemma
  genkit_flutter_gemma: ^0.6.0
  flutter_gemma: ^1.7.0
  # flutter_gemma 1.x registers no engine by default — opt into LiteRT-LM
  # (.litertlm inference) here.
  flutter_gemma_litertlm: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tourist_data/
