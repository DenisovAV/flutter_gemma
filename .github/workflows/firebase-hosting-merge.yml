# Auto-deploy the fluttergemma.dev website to Firebase Hosting on push to main.
# Builds two artifacts onto one hosting site:
#   /  + /docs/*  -> Jaspr static site (website/)
#   /try/...      -> the Flutter web example app (live demo)
name: Deploy website to Firebase Hosting (merge)
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'packages/flutter_gemma/example/**'
      - '.github/workflows/firebase-hosting-merge.yml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (bundles Dart)
        uses: subosito/flutter-action@v2
        with:
          # The workspace floor: flutter_gemma_rag_sqlite needs 3.47 for
          # sqlite3 3.6.0, and this job builds the example that depends on it.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        # Pin to 0.23.1 — jaspr_cli 0.23.2 fails with "Failed to start build
        # daemon, port file is missing" (build-daemon regression). Matches the
        # `jaspr: ^0.23.1` pin in website/pubspec.yaml. Bump deliberately.
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Build Jaspr site (SSG)
        working-directory: website
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          dart pub get
          jaspr build --sitemap-domain "https://fluttergemma.dev"

      - name: Export codelabs (claat static export → /codelabs)
        # Codelab sources: website/codelabs/<id>/index.md → self-contained HTML
        # under /codelabs/<id>/, served static (NOT rendered through Jaspr, so
        # bash/yaml/xml fences that break Jaspr's CodeBlock are fine). Native
        # linux claat from the official release, PINNED BY SHA-256: a git tag is
        # mutable, and this job holds the Firebase deploy secret, so the bytes
        # are verified before the binary is made executable or run.
        working-directory: website
        env:
          CLAAT_URL: https://github.com/googlecodelabs/tools/releases/download/v2.2.6/claat-linux-amd64
          CLAAT_SHA256: b7415471bd823562ebd9e6015e267a12fbf9340dfe839f8e2a175b6c7c0f397a
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/claat" "$CLAAT_URL"
          echo "$CLAAT_SHA256  $RUNNER_TEMP/claat" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/claat"
          # The export loop used to be duplicated here and in website/deploy.sh.
          # This job is the one that deploys the live site, so a fix applied to
          # deploy.sh alone was undone by the next merge. One script now, shared:
          # it exports, repoints the element library at our vendored copy (the
          # claat-public bucket returns 403), blanks claat's default Google
          # Analytics id, adds the codelabs to sitemap.xml, and keeps the
          # empty-output guard that stops a green build from 404-ing /codelabs.
          CLAAT="$RUNNER_TEMP/claat" DOMAIN="https://fluttergemma.dev" \
            tool/export_codelabs.sh

      - name: Build Flutter web example (live demo at /try)
        working-directory: packages/flutter_gemma/example
        run: |
          flutter pub get
          flutter build web --release --base-href /try/

      - name: Assemble /try into the Jaspr build output
        run: |
          rm -rf website/build/jaspr/try
          mkdir -p website/build/jaspr/try
          cp -R packages/flutter_gemma/example/build/web/. website/build/jaspr/try/

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AICHAT_C0C27 }}
          channelId: live
          projectId: aichat-c0c27
          entryPoint: website
          target: fluttergemma

      - name: Smoke-test the deployed codelabs
        # Every other check in this pipeline reads files on the runner. None of
        # them can tell whether the thing being served actually works — which is
        # precisely how the codelabs shipped for weeks pointing at a Google
        # Cloud Storage bucket that answered 403 to every request, with a green
        # build every time. This step fetches the live site instead.
        #
        # It runs AFTER the deploy on purpose: a failure here does not roll
        # anything back, it tells a human within minutes rather than whenever
        # someone next opens the page.
        working-directory: website
        run: |
          set -euo pipefail
          base="https://fluttergemma.dev"
          fail=0
          # cleanUrls + trailingSlash:false — a slashed URL 301s, so ask for the
          # canonical one and refuse to follow redirects: a redirect here would
          # mean the sitemap and the hosting config disagree.
          for src in codelabs/*/index.md; do
            [ -e "$src" ] || continue
            slug="$(basename "$(dirname "$src")")"
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$base/codelabs/$slug")"
            size="$(wc -c < /tmp/page.html | tr -d ' ')"
            if [ "$code" != "200" ] || [ "$size" -lt 5000 ]; then
              echo "ERROR: /codelabs/$slug -> HTTP $code, $size bytes" >&2
              fail=1
              continue
            fi
            # The page is only as good as what it loads. Follow each vendored
            # asset it references and require a non-trivial body.
            for asset in $(grep -oE '/codelab-assets/[A-Za-z0-9._-]+' /tmp/page.html | sort -u); do
              acode="$(curl -sS -o /tmp/asset -w '%{http_code}' "$base$asset")"
              asize="$(wc -c < /tmp/asset | tr -d ' ')"
              if [ "$acode" != "200" ] || [ "$asize" -lt 1000 ]; then
                echo "ERROR: $asset -> HTTP $acode, $asize bytes" >&2
                fail=1
              fi
            done
            echo "  ok  /codelabs/$slug ($size bytes)"
          done
          [ "$fail" -eq 0 ] || exit 1
