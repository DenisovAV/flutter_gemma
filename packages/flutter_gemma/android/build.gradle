group 'dev.flutterberlin.flutter_gemma'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    // No AGP classpath pin: Gradle loads parent-first, so the consuming app's AGP
    // is what resolves `com.android.library` regardless of anything named here.
    // The old 8.9.0 pin was inert and, in a file about AGP 9, actively misleading.
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.flutterberlin.flutter_gemma'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        targetSdk = 36
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

// Kotlin plugin ownership (#440): this package no longer applies KGP itself.
// Flutter's Gradle plugin applies `kotlin-android` to any subproject that
// applies AGP without it (`FlutterPluginUtils.detectApplyingKotlinGradlePlugin`),
// using whatever KGP version the CONSUMING APP declares. That code landed in
// flutter/flutter#184745, first released in 3.44 — which is what makes
// `flutter: '>=3.44.0'` in pubspec.yaml load-bearing rather than cosmetic.
//
// That apply is also why the bare `kotlin {}` below resolves — and that block is
// the safety net, not a liability: if KGP is ever not applied, configuration
// fails loudly with "Could not find method kotlin()" instead of quietly
// compiling no Kotlin. That is what makes this shape immune to #360.
//
// `dev.flutter.flutter-gradle-plugin` carries KGP itself, so a normal Flutter
// app builds even when its own settings.gradle.kts declares none (measured: the
// plugin classes were still in the dex). An add-to-app host that supplies no KGP
// does fail here — but it already failed on `large_file_handler`, a hard
// dependency shipping this same shape; the fix is one KGP line in the host.
//
// Do NOT try to insure against that with a `kotlin-gradle-plugin` classpath in
// the buildscript above. It cannot work: `detectApplyingKotlinGradlePlugin` runs
// while `:app` is evaluated, BEFORE this subproject's `buildscript {}` exists.
// A version pinned here is inert regardless — Gradle loads parent-first, so the
// app's KGP always wins. (That is also why the old `ext.kotlin_version` never
// did anything.)
//
// When AGP 10 removes `android.builtInKotlin=false`, KGP can no longer be
// applied and this block is what will break. The remedy is deletion, not a
// rewrite: built-in Kotlin derives jvmTarget from `compileOptions` above.
//
// Keep this block byte-identical in flutter_gemma, flutter_gemma_mediapipe and
// flutter_gemma_builtin_ai. #360 is what a half-fix looks like: the .kt stops
// compiling, the plugin class is never emitted, the build stays GREEN, and the
// app fails at runtime in GeneratedPluginRegistrant.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // MediaPipe (.task) inference moved to the flutter_gemma_mediapipe package
    // (com.google.mediapipe:tasks-genai + tasks-vision-image-generator live in
    // its android/build.gradle). Core only hosts the bundled file-ops +
    // litertlm NPU dispatch channel.

    // 0.15.2: localagents-rag dropped — embedding is now Dart-FFI + LiteRT
    // (see lib/core/litert/litert_embedding_model.dart). Guava +
    // kotlinx-coroutines-guava were only used by the RAG library, so they
    // also go.

    // .litertlm models go through Dart FFI (LiteRtLmFfiClient) — Native Assets
    // bundles libLiteRtLm.so + companion dylibs. No Gradle dependency needed.

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'junit:junit:4.13.2'
    // junit-vintage-engine lets JUnit 5 platform run JUnit 4 tests (used by
    // testOptions.unitTests.useJUnitPlatform()). Without this, our
    // org.junit.Test classes are silently skipped (#250 work).
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
}
